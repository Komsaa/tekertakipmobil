<svg width="560" height="160" viewBox="0 0 560 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Arka plan -->
  <rect width="560" height="160" rx="20" fill="#1B2437"/>

  <!-- İkon grubu — 130x130, ortada dikey -->
  <g transform="translate(15,15) scale(1.3)">
    <!-- Dış lastik halkası -->
    <circle cx="50" cy="50" r="43" stroke="white" stroke-width="9" fill="none"/>
    <!-- 3 jant kolu -->
    <line x1="50" y1="7"    x2="50" y2="50" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="12.7" y1="71.5" x2="50" y2="50" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="87.3" y1="71.5" x2="50" y2="50" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <!-- GPS pin -->
    <path d="M50 24 C39 24 30 33 30 43 C30 56 50 73 50 73 C50 73 70 56 70 43 C70 33 61 24 50 24Z" fill="#DC2626"/>
    <circle cx="50" cy="42" r="10" fill="white"/>
  </g>

  <!-- Metin: tekertakip -->
  <text
    x="168"
    y="103"
    font-family="'Arial Black', 'Franklin Gothic Heavy', Impact, 'Helvetica Neue', sans-serif"
    font-weight="900"
    font-size="72"
    letter-spacing="-2"
  >
    <tspan fill="white">teker</tspan><tspan fill="#DC2626">takip</tspan>
  </text>
</svg>
